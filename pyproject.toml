[project]
name = "laser-beamline-platform"
version = "1.0.0"
description = "Laser-software platform: device drivers, ISO 11146 diagnostics, alignment, interlocks, data, tested on a simulated beamline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py>=3.10", "fastapi>=0.110", "httpx>=0.27", "pydantic>=2", "pillow>=10"]

[project.optional-dependencies]
dds = ["cyclonedds>=0.10"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "matplotlib>=3.8", "pybind11>=2.12", "uvicorn>=0.29"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
